name: Deploy gallery API Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:worker
      - run: npm test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply aleem-nurul-gallery-db --remote --config worker/wrangler.toml --env=""
      - name: Apply private R2 browser safeguards
        run: |
          npx wrangler r2 bucket cors set aleem-nurul-gallery --file worker/r2-cors.production.json --force
          npx wrangler r2 bucket lifecycle remove aleem-nurul-gallery --id expire-gallery-staging || true
          npx wrangler r2 bucket lifecycle add aleem-nurul-gallery expire-gallery-staging staging/ --expire-days 1
          npx wrangler r2 bucket lifecycle remove aleem-nurul-gallery --id abort-stale-archive-multipart || true
          npx wrangler r2 bucket lifecycle add aleem-nurul-gallery abort-stale-archive-multipart archives/ --abort-multipart-days 1 --force
      - name: Deploy Worker
        run: npx wrangler deploy --config worker/wrangler.toml --env=""
