name = "aleem-nurul-gallery-api"
main = "src/index.ts"
compatibility_date = "2026-08-30"
compatibility_flags = ["nodejs_compat"]
routes = [{ pattern = "gallery-api.aleemxnurul.love", custom_domain = true }]

[observability]
enabled = true
head_sampling_rate = 1

[ai]
binding = "AI"

[[vectorize]]
binding = "SEMANTIC_INDEX"
index_name = "aleem-nurul-wedding-semantic"

# FACE_INDEX is intentionally absent in production. Add the binding only after
# selecting a provider with documented dimensions/metric and creating the
# matching index; see README.md and docs/privacy-ai.md.

[[queues.producers]]
binding = "AI_PROCESSING_QUEUE"
queue = "gallery-ai-processing"

[[queues.producers]]
binding = "CLEANUP_QUEUE"
queue = "gallery-cleanup"

[[queues.consumers]]
queue = "gallery-ai-processing"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "gallery-ai-dead-letter"
max_concurrency = 5
retry_delay = 60

[[queues.consumers]]
queue = "gallery-ai-dead-letter"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1

[[queues.consumers]]
queue = "gallery-cleanup"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "gallery-ai-dead-letter"
max_concurrency = 2
retry_delay = 60

[[workflows]]
name = "gallery-media-analysis"
binding = "MEDIA_ANALYSIS_WORKFLOW"
class_name = "MediaAnalysisWorkflow"

[[d1_databases]]
binding = "DB"
database_name = "aleem-nurul-gallery-db"
database_id = "e6c0bf2d-b38d-4e3f-bf05-ed94b9ac1950"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "aleem-nurul-gallery"

[vars]
ENVIRONMENT = "production"
R2_ACCOUNT_ID = "84aaa07b9bf25ab903e603f8ef24c4d8"
R2_BUCKET_NAME = "aleem-nurul-gallery"
ALLOWED_ORIGIN = "https://gallery.aleemxnurul.love"
TURNSTILE_EXPECTED_HOSTNAME = "gallery.aleemxnurul.love"
TURNSTILE_BYPASS = "false"
AUTO_APPROVE_UPLOADS = "false"
UPLOAD_URL_TTL_SECONDS = "600"
ADMIN_SESSION_TTL_SECONDS = "28800"
SOFT_STORAGE_WARNING_GB = "450"
HARD_STORAGE_LIMIT_GB = ""
MOCK_AI = "false"
VISION_MODEL = "@cf/google/gemma-4-26b-a4b-it"
VISION_MODEL_VERSION = "2026-04"
SEMANTIC_MODEL = "@cf/qwen/qwen3-embedding-0.6b"
SEMANTIC_MODEL_VERSION = "2025-06"
SEMANTIC_EMBEDDING_DIMENSIONS = "1024"
AI_PROCESSING_MAX_PER_MINUTE = "30"
FACE_PROVIDER = ""
FACE_QUERY_TOP_K = "100"
FIND_ME_MAX_IMAGE_BYTES = "6291456"
SEARCH_SESSION_TTL_SECONDS = "600"
ARCHIVE_DOWNLOAD_TTL_SECONDS = "600"

[triggers]
crons = ["*/15 * * * *"]

[env.development]
name = "aleem-nurul-gallery-api-dev"
routes = []

[env.development.ai]
binding = "AI"

[[env.development.d1_databases]]
binding = "DB"
database_name = "aleem-nurul-gallery-db-dev"
database_id = "local-gallery-db"
migrations_dir = "migrations"

[[env.development.r2_buckets]]
binding = "MEDIA"
bucket_name = "aleem-nurul-gallery-dev"

[[env.development.vectorize]]
binding = "SEMANTIC_INDEX"
index_name = "aleem-nurul-wedding-semantic-dev"

[[env.development.vectorize]]
binding = "FACE_INDEX"
index_name = "aleem-nurul-wedding-faces-dev"

[[env.development.queues.producers]]
binding = "AI_PROCESSING_QUEUE"
queue = "gallery-ai-processing-dev"

[[env.development.queues.producers]]
binding = "CLEANUP_QUEUE"
queue = "gallery-cleanup-dev"

[[env.development.queues.consumers]]
queue = "gallery-ai-processing-dev"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "gallery-ai-dead-letter-dev"
max_concurrency = 1

[[env.development.queues.consumers]]
queue = "gallery-ai-dead-letter-dev"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 1
max_concurrency = 1

[[env.development.queues.consumers]]
queue = "gallery-cleanup-dev"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "gallery-ai-dead-letter-dev"
max_concurrency = 1

[[env.development.workflows]]
name = "gallery-media-analysis-dev"
binding = "MEDIA_ANALYSIS_WORKFLOW"
class_name = "MediaAnalysisWorkflow"

[env.development.vars]
ENVIRONMENT = "development"
R2_ACCOUNT_ID = "local"
R2_BUCKET_NAME = "aleem-nurul-gallery-dev"
ALLOWED_ORIGIN = "http://localhost:5173,http://127.0.0.1:5173"
TURNSTILE_EXPECTED_HOSTNAME = "localhost"
TURNSTILE_BYPASS = "true"
AUTO_APPROVE_UPLOADS = "false"
UPLOAD_URL_TTL_SECONDS = "600"
ADMIN_SESSION_TTL_SECONDS = "28800"
SOFT_STORAGE_WARNING_GB = "450"
HARD_STORAGE_LIMIT_GB = ""
MOCK_AI = "true"
VISION_MODEL = "mock"
VISION_MODEL_VERSION = "mock-v1"
SEMANTIC_MODEL = "mock"
SEMANTIC_MODEL_VERSION = "mock-v1"
SEMANTIC_EMBEDDING_DIMENSIONS = "16"
AI_PROCESSING_MAX_PER_MINUTE = "120"
FACE_PROVIDER = "mock"
FACE_EMBEDDING_MODEL = "deterministic-development-face"
FACE_EMBEDDING_MODEL_VERSION = "mock-v1"
FACE_EMBEDDING_DIMENSIONS = "16"
FACE_DISTANCE_METRIC = "cosine"
FACE_SCORE_MIN = "0"
FACE_SCORE_MAX = "1"
FACE_QUERY_TOP_K = "100"
FIND_ME_MAX_IMAGE_BYTES = "6291456"
SEARCH_SESSION_TTL_SECONDS = "600"
ARCHIVE_DOWNLOAD_TTL_SECONDS = "600"
